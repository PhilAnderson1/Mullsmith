# Gabkeep — isolated staging instance for the OWASP ZAP baseline scan.
# NEVER run this as a real deployment: registration is open and rate limits
# are raised so the scanner is not starved. Loopback bind + TLS with a
# self-signed cert (ZAP accepts it); separate DB/scratchpad from dev data.

server:
  listen: "127.0.0.1:18099"
  public_url: "https://127.0.0.1:18099"
  tls:
    enabled: true
    cert_file: "/tmp/opencode/zap-target/cert.pem"
    key_file: "/tmp/opencode/zap-target/key.pem"
  hsts_max_age: 31536000

database:
  dir: "/tmp/opencode/zap-target/db"

scratchpad:
  root: "/tmp/opencode/zap-target/scratchpad"

llm:
  endpoint: "http://127.0.0.1:1/v1"   # unreachable: no real LLM calls during scan
  model: "scan-none"

tools:
  web_search:
    enabled: false
  web_fetch:
    enabled: false
  agent:
    approval: {}

auth:
  registration: open          # loopback scan instance only (§9.12)
  cookie_secure: true
  max_failed_logins: 1000     # do not lock the scanner out mid-scan

rate_limit:
  requests_per_minute: 100000
  chat_messages_per_hour: 100000

logging:
  level: warn
  format: text
