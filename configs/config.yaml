# Mullsmith production configuration.
# Copy and edit this file, then verify it with:
# mullsmith -config /etc/mullsmith/config.yaml -check-config
# Relative paths resolve from this file's directory.
# Secrets support ${ENV_VAR} and ${ENV_VAR:-default} expansion.
# YAML indentation uses two spaces per level; never tabs.


# Mullsmith's HTTP server settings
server:
  # Address and port to serve. The default listens on all IPv4 and IPv6 addresses.
  # Use "127.0.0.1:3210" for localhost only.
  listen: ":3210"

  # Browser-visible host used for email and OAuth links; an optional port
  # overrides the listener port, e.g. "mullsmith.example.org:3210".
  host: ""

  # Maximum open TCP connections.
  max_connections: 128

  # Maximum active HTTP requests.
  concurrent_requests: 32

  # Maximum non-upload request body.
  max_body_bytes: "1MiB"

  tls:
    # Serve using SSL (HTTPS)
    enabled: false

    # TLS certificate path.
    cert_file: "/run/mullsmith/cert.pem"

    # TLS private-key path.
    key_file: "/run/mullsmith/key.pem"

  # Proxies trusted to supply client IPs.
  trusted_proxies: []

  # HSTS lifetime in seconds; -1 disables.
  hsts_max_age: 31536000

  # Maximum request-read time.
  read_timeout: "30s"

  # Maximum stalled response-write time.
  write_timeout: "60s"

  # Graceful-shutdown deadline.
  shutdown_grace: "15s"


# Model endpoint and generation behavior.
llm:
  # OpenRouter is ready to use once you add your API key below (paid usage).
  # For a local model server, change the endpoint, endpoint_type and model entry.
  endpoint: "https://openrouter.ai/api/v1"

  # Endpoint type, supported options are: gufo, llama_cpp, vllm, lm_studio, ollama_openai, openrouter.
  endpoint_type: "openrouter"

  # Your API key (if applicable)
  api_key: "YOUR_API_KEY_GOES_HERE"
  # To keep this secret in a separate environment file, use the following environment variable:
  # api_key: "${MULLSMITH_LLM_API_KEY:-}"

  # Models supported by your endpoint. Qwen3.8-27B is the example default;
  # change it to the model served by your endpoint. Add another entry for
  # each additional model you want to offer.
  models:
    # Endpoint model identifier.
    - id: "qwen/qwen3.8-27b"

      # Select this model by default.
      default: true

      # Thinking profile from thinking-profiles.yaml; use none to disable.
      # Supported profiles: none, qwen3_5, qwen3_6, qwen3_8, qwen3_8_thinking_only,
      # gpt_oss, gemma4, deepseek_v4, deepseek_v4_1, glm5_3, kimi_k2_6,
      # kimi_k2_7_code, kimi_k3, minimax_m2_7, minimax_m3_1_flash,
      # step3_7_flash, step5_preview, minicpm5_2b.
      # If the required profile is not listed, it can probably be added to thinking-profiles.yaml.
      thinking_profile: "qwen3_8"

      # Model context window in tokens; omit to discover it automatically (if supported by endpoint).
      # context_size: 262144

      # This model supports image input.
      vision: true

  # Sampling temperature for new requests.
  default_temperature: 0.7

  # Maximum generated tokens per response.
  max_tokens_response: 4096

  # Display model reasoning in chats.
  show_reasoning: false

  # Maximum wait for response headers.
  upstream_header_timeout: "90s"

  # Maximum silence during streaming.
  upstream_stall_timeout: "120s"

  # Endpoint request-template catalogue. If your endpoint type is not listed
  # above, you may be able to define it in this file.
  endpoints_file: "./endpoints.yaml"

  # Thinking-choice catalogue. If your model family is not listed above,
  # you may be able to define it in this file.
  profiles_file: "./thinking-profiles.yaml"


# Account access and session policy.
auth:
  # Account creation: "open", "invite-only", or "closed". "open" is
  # suitable only on a trusted LAN. Create the first account using the admin CLI.
  registration: "invite-only"

  # Global open-registration rate limit.
  max_signups_per_hour: 5

  # Offer persistent login.
  remember_login: true

  # Standard session lifetime.
  session_ttl: "24h"

  # Persistent session sliding lifetime.
  remember_ttl: "720h"

  # Persistent session maximum lifetime.
  remember_absolute_ttl: "2160h"

  # Failed attempts before temporary lockout.
  max_failed_logins: 10

  # Password-hashing cost.
  argon2: { time: 1, memory: 65536, threads: 4 }


# Model-callable tool configuration.
tools:
  web_search:
    # Offer web_search to models.
    enabled: false

    # Search service implementation; "brave" is currently the only available option.
    provider: "brave"

    # Search service credential.
    api_key: ""
    # To keep this secret in a separate environment file, use the following environment variable:
    # api_key: "${MULLSMITH_SEARCH_API_KEY:-}"

    # Maximum results per search.
    max_results: 8

  web_fetch:
    # Offer web_fetch to models.
    enabled: true

    # Maximum fetched response size.
    max_bytes: "512KiB"

    # Fetch request deadline.
    timeout: "15s"

  web_download:
    # Offer web_download to models.
    enabled: true

    # Maximum downloaded file size.
    max_bytes: "1GiB"

    # Download request deadline.
    timeout: "60s"

  code_run:
    # Offer code_run to models.
    enabled: false

    allowed_runtimes:
      # Python runtime.
      - { id: "python3", binary: "/usr/bin/python3" }

      # POSIX shell runtime.
      - { id: "sh", binary: "/bin/sh" }

    # Maximum runtime per execution.
    timeout: "30s"

    # Maximum stdout and stderr size each.
    max_output: "256KiB"

    # Maximum process-tree memory.
    max_memory: "1GiB"

    # Allow network access from code.
    allow_network: false

  agent:
    # Maximum model tool rounds per turn.
    max_tool_rounds: 20

    # Maximum proposed tool calls per turn.
    max_tool_calls_per_turn: 100

    # Tool cards to display: "useful" hides successful status-only cards; "all" shows everything.
    tool_cards: "useful"

    # Tool approval policy. "auto" runs the tool immediately; "confirm" asks
    # the user first. An approval can be remembered for the current conversation.
    approval:
      web_search: "auto"
      web_fetch: "auto"
      web_download: "auto"
      fs_list: "auto"
      fs_read: "auto"
      fs_write: "auto"
      fs_delete: "confirm"
      files_share: "auto"
      display_image: "auto"
      view_image: "auto"
      code_run: "confirm"


# Administrator-managed Model Context Protocol servers. Remote tools use the
# existing agent limits and default to asking for confirmation.
mcp:
  # Writable state and cache directory for locally executed stdio servers.
  state_dir: "/var/lib/mullsmith/mcp"

  # Allow users to connect their own accounts to configured OAuth servers.
  enable_oauth: false

  # Base64-encoded 32-byte key used to encrypt OAuth tokens in the database.
  # Generate one on your computer with: openssl rand -base64 32
  token_encryption_key: ""
  # To keep this secret in a separate environment file, use the following environment variable:
  # token_encryption_key: "${MULLSMITH_MCP_TOKEN_KEY:-}"

  # Per-server deferred loading (optional; false by default):
  # deferred_load: true
  # provides_summary: "Describe the capabilities the model can load."
  # Initially offers <id>_load instead of the server's full tool schemas.
  # Loading persists for the conversation; tool approvals are unchanged.
  # provides_summary is required when deferred_load is true (max 1000 characters).
  servers: []

  # Unauthenticated Streamable HTTP examples (remove servers: [] before use):
  # servers:
  #   - id: "deepwiki"
  #     deferred_load: true
  #     provides_summary: "Read documentation and answer questions about GitHub repositories."
  #     name: "DeepWiki"
  #     transport: "streamable_http"
  #     url: "https://mcp.deepwiki.com/mcp"
  #     approval: "confirm"
  #
  #   - id: "weather"
  #     deferred_load: true
  #     provides_summary: "Look up weather conditions and forecasts."
  #     name: "Weather"
  #     transport: "streamable_http"
  #     url: "https://weatherthatdoesntsuck.com/api/mcp"
  #     approval: "confirm"
  #
  #   - id: "wikidata"
  #     deferred_load: true
  #     provides_summary: "Search Wikidata entities and query structured knowledge."
  #     name: "Wikidata"
  #     transport: "streamable_http"
  #     url: "https://wd-mcp.wmcloud.org/mcp"
  #     approval: "confirm"

  # Per-user OAuth examples. Register the callback URL shown by -check-config
  # with the provider, then supply its client credentials.
  # servers:
  #   - id: "github"
  #     name: "GitHub"
  #     transport: "streamable_http"
  #     url: "https://api.githubcopilot.com/mcp/"
  #     oauth:
  #       client_id: "${GITHUB_OAUTH_CLIENT_ID}"
  #       client_secret: "${GITHUB_OAUTH_CLIENT_SECRET}"
  #       issuer: "https://github.com"
  #     approval: "confirm"
  #
  # Google Calendar OAuth example (use your registered client credentials):
  #   - id: "google_calendar"
  #     deferred_load: true
  #     provides_summary: "Find and manage Google Calendar calendars and events."
  #     name: "Google Calendar"
  #     transport: "streamable_http"
  #     url: "https://calendarmcp.googleapis.com/mcp/v1"
  #     oauth:
  #       client_id: "${GOOGLE_CALENDAR_CLIENT_ID}"
  #       client_secret: "${GOOGLE_CALENDAR_CLIENT_SECRET}"
  #       issuer: "https://accounts.google.com"
  #       scopes:
  #         - "https://www.googleapis.com/auth/calendar.calendarlist.readonly"
  #         - "https://www.googleapis.com/auth/calendar.events.freebusy"
  #         - "https://www.googleapis.com/auth/calendar.events.readonly"
  #     approval: "confirm"
  #
  # Servers that support dynamic client registration need no administrator-
  # supplied client ID or secret:
  # servers:
  #   - id: "todoist"
  #     deferred_load: true
  #     provides_summary: "Manage Todoist tasks and projects."
  #     name: "Todoist"
  #     transport: "streamable_http"
  #     url: "https://ai.todoist.net/mcp"
  #     oauth:
  #       dynamic_client_registration: true
  #       issuer: "https://todoist.com"
  #       scopes: ["data:read_write"]
  #     approval: "confirm"

  # Remote servers may use a shared bearer token or custom API-key headers.
  # Keep secrets in the service environment rather than writing them here.
  # servers:
  #   - id: "authenticated_service"
  #     name: "Authenticated service"
  #     transport: "streamable_http"
  #     url: "https://mcp.example.org/mcp"
  #     bearer_token: "${MCP_SERVICE_TOKEN}"
  #     # Alternatively, for services using an API-key header:
  #     # headers:
  #     #   X-API-Key: "${MCP_SERVICE_API_KEY}"
  #     approval: "confirm"

  # Local stdio servers are administrator-installed programs. Mullsmith runs
  # the executable directly, without a shell, using its own state directory.
  # servers:
  #   - id: "local_tools"
  #     name: "Local tools"
  #     transport: "stdio"
  #     command: "/usr/local/bin/local-mcp-server"
  #     args: []
  #     environment:
  #       EXAMPLE_API_KEY: "${MCP_EXAMPLE_API_KEY:-}"
  #     approval: "confirm"


# Per-user files and code sandbox.
scratchpad:
  # Scratchpad storage directory.
  root: "/var/lib/mullsmith/scratchpad"

  # Maximum uploaded file size.
  max_file_size: "25MiB"

  # Maximum stored bytes per user.
  user_quota: "1GiB"

  # Maximum filesystem entries per user.
  max_entries: 1000

  # Shared-artifact retention time.
  artifact_ttl: "168h"

  # Temporary-work retention time.
  work_ttl: "24h"

  # Upload extensions to reject.
  block_extensions: []

# Password-reset and confirmation email.
email:
  # Enable email-based account flows.
  enabled: false

  smtp:
    # SMTP server hostname.
    host: ""

    # SMTP submission port.
    port: 587

    # Authenticate after establishing TLS.
    authenticated_smtp: true

    # SMTP account name.
    username: ""

    # SMTP account password.
    password: ""
    # To keep this secret in a separate environment file, use the following environment variable:
    # password: "${MULLSMITH_SMTP_PASSWORD:-}"

    # Envelope and message sender.
    from: "mullsmith@localhost"


# Application-wide usage controls.
app_limits:
  # Maximum characters per user message.
  max_message_chars: 32000

  # Maximum attachments per message.
  max_attachments: 8

  # Maximum bytes per image shown to a model.
  vision_max_image_bytes: "4MiB"

  # Maximum images included in one conversation's model context.
  vision_max_images_per_conversation: 8

  # Maximum stored chats per user.
  max_conversations_per_user: 1000

  # Maximum stored messages per user.
  max_messages_per_user: 10000

  # Maximum simultaneous replies per user.
  concurrent_streams_per_user: 2

  # Maximum simultaneous replies overall.
  concurrent_streams_total: 8

  # Per-user API request rate.
  requests_per_minute: 120

  # Per-user chat submission rate.
  chat_messages_per_hour: 120

  # Simultaneous password hashes.
  hash_concurrency: 1

  # Simultaneous uploads overall.
  concurrent_uploads: 8

  # Simultaneous uploads per user.
  concurrent_uploads_per_user: 2

  # Simultaneous downloads per user.
  concurrent_downloads_per_user: 2


# Persistent database location.
database:
  # SQLite data directory.
  dir: "/var/lib/mullsmith/db"


# Service log output.
logging:
  # Minimum logged severity.
  level: "info"

  # Output format: text or json.
  format: "text"

  # Log file; empty uses stderr.
  file: ""
