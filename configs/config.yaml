# Gabkeep — production config template (spec.md §2.2).
# Copy, edit, then verify with:  gabkeep -config /etc/gabkeep/config.yaml -check-config
# Relative paths resolve against this file's directory. Secrets go in via
# ${ENV_VAR} / ${ENV_VAR:-default} expansion (§9.12) — never commit them.

server:
  listen: ":3210"                 # every interface (IPv4+IPv6): usable on your
                                  # network right away over plain HTTP — the
                                  # startup warning about TLS is expected there.
                                  # Loopback only (proxy in front): "127.0.0.1:3210"
  tls:
    enabled: false                # true + cert/key here, or terminate at proxy
    # To serve HTTPS directly: un-comment the commented ExecStartPre line in
    # the shipped unit (packaging/systemd/gabkeep.service) and set its
    # YOUR.HOSTNAME to your certbot domain. It then stages certbot's key into
    # RAM-only /run/gabkeep at service start — the key never persists to disk
    # and no group grants are needed:
    cert_file: "/run/gabkeep/cert.pem"
    key_file: "/run/gabkeep/key.pem"
  trusted_proxies: []             # CIDRs of your proxies ONLY (§9.11 spoofing)
  hsts_max_age: 31536000          # HSTS when serving TLS; -1 disables
  read_timeout: 30s               # slow-body guard on the listening socket
  write_timeout: -1               # -1 = no write cap — responses stream (SSE)
  shutdown_grace: 15s             # in-flight grace on SIGTERM

database:
  dir: "/var/lib/gabkeep/db"

scratchpad:
  root: "/var/lib/gabkeep/scratchpad"
  max_file_size: 25MiB
  user_quota: 1GiB
  artifact_ttl: 168h              # shared artifacts expire after 7 days
  work_ttl: 24h                   # per-run work dirs swept past this age
  # Extensions that may not be uploaded. Empty/absent = no blocking: safety
  # does not depend on this gate — downloads are ALWAYS served as attachment
  # files (§9.4), so even an uploaded .html cannot run in the app's origin.
  # Use it only to keep types you never want on disk, e.g.:
  # block_extensions: [exe, dll, so, bat, cmd, com, scr, msi, js, jar]
  block_extensions: []
  code_execution:                 # §9.9 — OFF by default; enable deliberately
    enabled: false
    # One sandbox, always: every script runs inside a bubblewrap (bwrap)
    # jail — own namespaces, read-only /usr, only the user's work dir
    # writable, network off unless allow_network. Requires the bubblewrap
    # package; gabkeep refuses to start with enabled: true when bwrap is
    # missing or unprivileged user namespaces are disabled.
    # max_memory is a PER-RUN aggregate: the whole process tree (children
    # included) shares it via a per-run cgroup, which needs a delegated
    # cgroup v2 subtree — for systemd use packaging/systemd/gabkeep.service as shipped
    # (Delegate=yes + DelegateSubgroup=payload). Metering unavailable ⇒
    # refuses to start, same fail-closed contract (§9.9).
    # (Old keys mode/container_image/run_as_user are retired — remove them.)
    allowed_runtimes:
      - { id: python3, binary: /usr/bin/python3 }
      - { id: sh, binary: /bin/sh }
    timeout: 30s
    max_output: 32KiB
    max_memory: 256MiB
    allow_network: false
  # Approval policy per tool: auto | confirm (unknown tool ⇒ confirm).
  # code_run is always confirm-capable; keep it that way unless you know
  # exactly what you are doing (§9.9/§9.13).

llm:
  endpoint: "http://127.0.0.1:8081/v1"   # your OpenAI-compatible server
  api_key: "${GABKEEP_LLM_API_KEY:-}"
  model: "your-model-name"
  models: []                             # picker list; the model above is always in it
  max_context_tokens: -1                 # -1 = read the window from the endpoint's /models listing;
                                         # set a number to pin it. When auto-detection finds
                                         # nothing, the meter shows plain token counts and an
                                         # overfull conversation fails at the endpoint.
  default_temperature: 0.7
  request_timeout: 5m
  max_tokens_response: 4096
  show_reasoning: false
  # Vision: the model may look at pictures with the view_image tool
  # (spec §7.2) — uploads always ride as manifest pointers only, and
  # the tool's turns are the sole path image bytes take to the endpoint.
  # OFF by default — only enable it when the model behind endpoint
  # actually accepts image content; a text-only model then gets the
  # plain-string manifest and no view_image tool at all.
  vision: false
  vision_max_image_bytes: 4MiB    # per-picture cap for view_image

tools:
  web_search:
    enabled: false                # true + brave key to enable "search the web"
    provider: "brave"             # the only implemented provider
    api_key: "${GABKEEP_SEARCH_API_KEY:-}"
    max_results: 8
  web_fetch:
    enabled: true                 # SSRF-guarded egress (§9.6); public web only
    max_bytes: 512KiB
    timeout: 15s
  agent:
    max_tool_rounds: 8
    approval:
      web_search: auto
      web_fetch: auto
      fs_list: auto
      fs_read: auto
      fs_write: auto
      files_share: auto
      code_run: confirm

auth:
  registration: invite-only       # open | invite-only | closed (admin CLI users)
  max_signups_per_hour: 5         # global cap, enforced only when registration
                                  # is open (per-IP limits don't stop a proxy
                                  # pool); -1 disables it — fine on a LAN
  remember_login: true            # shows the "Stay logged in" checkbox
  session_ttl: 24h
  remember_ttl: 720h              # with the checkbox ticked
  remember_absolute_ttl: 2160h
  max_failed_logins: 10
  argon2: { time: 1, memory: 65536, threads: 4 }  # hash parameters; stored in
                                  # each hash, so retuning only affects new ones

email:                            # password reset + email confirmation
  enabled: false                  # master switch; enabling later never touches
                                  # existing accounts (no retroactive confirming)
  # Absolute origin the links in mails are built from — REQUIRED when enabled.
  # Never derived from request headers on purpose: a spoofed Host must not be
  # able to inject an attacker domain into password-reset links.
  base_url: ""                    # e.g. https://gabkeep.example:3210
  smtp:
    host: ""                      # submission server hostname or address
    port: 587                     # 587 (STARTTLS) or 465 (implicit TLS)
    authenticated_smtp: true      # true → AUTH LOGIN (never before TLS);
                                  # false → unauthenticated send (LAN relay)
    username: ""
    password: "${GABKEEP_SMTP_PASSWORD:-}"   # keep the secret in the service
                                  # EnvironmentFile (§9.12), not in this file
    from: "gabkeep@localhost"     # envelope sender + From header
  # With enabled: true, new sign-ups must click a confirmation link within
  # 24 hours (or the pending account is deleted); "Forgot password?" appears
  # on the login page for accounts with a confirmed address. Authenticated
  # SMTP on port 25 is a config error — credentials never go in the clear.

limits:
  max_body_bytes: 1MiB
  max_message_chars: 32000
  max_attachments: 8
  # Caps below: values are the program defaults spelled out. -1 disables
  # the control; omitting a key takes the default; 0 and any other
  # negative are a config error. (rate_limit: is retired — these knobs
  # all live here now.)
  concurrent_streams_per_user: 2  # parallel SSE generations per user
  concurrent_streams_total: 8     # all users combined (global backstop)
  requests_per_minute: 120        # per authenticated user, non-chat endpoints
  chat_messages_per_hour: 120     # per user
  hash_concurrency: 1             # simultaneous Argon2 computations, all users
  concurrent_uploads: 8           # in-flight uploads, all users (§9.11)

logging:
  level: info                     # debug | info | warn | error
  format: text                    # json for log pipelines
  file: ""                        # empty = stderr (let journald capture it)
